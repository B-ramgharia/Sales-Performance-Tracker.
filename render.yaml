services:
  - type: web
    name: sales-performance-tracker
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///sales.db # Change this if using a managed database
      - key: JWT_SECRET_KEY
        fromContext: secret
      - key: NODE_VERSION
        value: 18.0.0
