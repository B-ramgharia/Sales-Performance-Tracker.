services:
  - type: web
    name: sales-performance-tracker
    env: python
    buildCommand: |
      cd frontend && npm install && npm run build
      cd ../backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        value: sqlite:///sales.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NODE_VERSION
        value: 18.0.0
